[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs

lib_deps =
	knolleary/PubSubClient@^2.8
	adafruit/DHT sensor library@^1.4.7
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1      ; ou ST7789_DRIVER, o que funcionou
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000